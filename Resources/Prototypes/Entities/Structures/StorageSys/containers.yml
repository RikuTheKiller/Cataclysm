- type: entity
  abstract: true
  parent: [ BaseMachinePowered ]
  id: BaseStorageContainer
  components:
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: Appearance
  - type: WiresVisuals
  - type: Physics
    bodyType: Static
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: WiresPanel
  - type: Transform
    anchored: true
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: NodeContainer
    nodes:
      storage:
        !type:StorageDeviceNode
        nodeGroupID: Storage

- type: entity
  parent: BaseStorageContainer
  id: MaterialStorageContainer
  name: material storage container
  description: Can store a lot of materials, ranging from ores to sheets.
  components:
  - type: Sprite
    sprite: Structures/StorageSys/Containers/small_storage_container.rsi
    layers:
    - state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 10000 # 10000 kg, or 2.5 plastitanium walls.
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: MaterialStorageContainer
    capacity: 5000 # 50 stacks